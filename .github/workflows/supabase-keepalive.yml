name: Supabase Keepalive

on:
  schedule:
    # Run once per day. GitHub Actions uses UTC.
    - cron: "17 0 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Supabase keepalive RPC
        env:
          SUPABASE_URL: https://eomtqlieheskawkttbpf.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            --header "apikey: $SUPABASE_KEY" \
            --header "Authorization: Bearer $SUPABASE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
          echo "Supabase keepalive RPC succeeded."
